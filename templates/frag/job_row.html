<div class="oh-job">
  <span class="oh-badge oh-badge-{{ j.state }}">
    {% if j.state == "running" %}
      <span class="oh-spinner oh-spinner-inline" style="width:0.85rem; height:0.85rem; border-width:2px;" aria-hidden="true"></span>
    {% endif %}
    <span>{{ j.state }}</span>
  </span>
  <span class="oh-job-label">{{ j.label }}</span>
  <span class="oh-muted">{{ j.detail }}</span>
  {% if j.error.is_some() %}
    <span class="oh-alert oh-alert-warn">{{ j.error.as_ref().unwrap() }}</span>
  {% endif %}
  {% if j.can_cancel %}
    <button class="oh-btn oh-btn-small oh-btn-danger" type="button"
            hx-post="/api/job/{{ j.id }}/cancel" hx-target="#oh-job-row-{{ j.id }}" hx-swap="outerHTML">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12"></rect>
      </svg>
      <span>Stop</span>
    </button>
    <span hx-get="/api/job/{{ j.id }}" hx-trigger="every 2s" hx-swap="outerHTML"
          hx-target="#oh-job-row-{{ j.id }}" class="oh-visually-hidden"></span>
  {% else %}
    <a class="oh-btn oh-btn-small" href="/media/job/{{ j.id }}/index.m3u8">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Playlist</span>
    </a>
  {% endif %}
</div>

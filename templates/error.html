{% extends "layout.html" %}
{% block title %}{{ title }} · OtakuHub{% endblock %}

{% block content %}
<section class="oh-narrow oh-enter" style="padding-top:2rem;">
  <div class="oh-panel oh-panel-raised" style="text-align:center;">
    <div style="width:4rem; height:4rem; border-radius:var(--radius-pill); background:var(--warn-glow); color:var(--warn); display:grid; place-items:center; margin:0 auto 1.25rem; box-shadow:var(--shadow-inset-pill);">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h1 class="oh-h2">{{ heading }}</h1>
    <p class="oh-muted" style="margin-bottom:1.5rem;">{{ message }}</p>
    <a class="oh-btn oh-btn-primary" href="/">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>
  </div>
</section>
{% endblock %}
